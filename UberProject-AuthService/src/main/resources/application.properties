spring.application.name=UberAuthService

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uber_db_local}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Nasir@02}


spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.port=7474

logging.level.org.springframework.data=DEBUG

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

cookie.expiry=${COOKIE_EXPIRY:3600}
jwt.expiry=${JWT_EXPIRY:3600}
jwt.secret=${JWT_SECRET:default_uber_jwt_secret_key_change_in_production_min_256_bits_12345}

eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true