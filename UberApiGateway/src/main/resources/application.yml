server:
  port: ${GATEWAY_PORT:8080}

jwt:
  secret: ${JWT_SECRET:default_uber_jwt_secret_key_change_in_production_min_256_bits_12345}

spring:
  application:
    name: UberApiGateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:lb://UBERAUTHSERVICE}
          predicates:
            - Path=/api/v1/auth/**
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:lb://UBERBOOKINGSERVICE}
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/booking/**
        - id: location-service
          uri: ${LOCATION_SERVICE_URL:lb://UBERPROJECT-LOCATIONSERVICE}
          predicates:
            - Path=/api/v1/location/**, /api/location/**
        - id: review-service
          uri: ${REVIEW_SERVICE_URL:lb://UBERREVIEWSERVICE}
          predicates:
            - Path=/api/v1/reviews/**, /api/v1/review/**
        - id: socket-service
          uri: ${SOCKET_SERVICE_URL:lb://CLIENTSOCKETSERVICE}
          predicates:
            - Path=/ws/**, /api/socket/**

eureka:
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway
