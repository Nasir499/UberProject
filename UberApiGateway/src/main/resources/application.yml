server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: UberApiGateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        - id: auth-service
          uri: lb://UBERAUTHSERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: booking-service
          uri: lb://UBERBOOKINGSERVICE
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/booking/**
        - id: location-service
          uri: lb://UBERPROJECT-LOCATIONSERVICE
          predicates:
            - Path=/api/v1/location/**, /api/location/**
        - id: review-service
          uri: lb://UBERREVIEWSERVICE
          predicates:
            - Path=/api/v1/reviews/**, /api/v1/review/**
        - id: socket-service
          uri: lb://CLIENTSOCKETSERVICE
          predicates:
            - Path=/ws/**, /api/socket/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway
